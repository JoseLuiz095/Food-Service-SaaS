name: Vendas e estoque
on:
  pull_request:
    paths:
      - 'src/**'
      - 'worker/**'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/_headers'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/food-order-payment/**'
      - 'supabase/functions/food-public-checkout/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vendas-estoque.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:seo
      - run: node --test scripts/password-recovery-test.mjs
      - run: node scripts/receipt-contacts-db-test.mjs
      - run: node scripts/receipt-source-db-test.mjs
      - run: npm run test:payment-links
      - run: npm run test:fitness
      - run: npm run smoke
      - run: npm run test:critical
      - run: npm run test:integrations
      - run: node scripts/sales-stock-db-test.mjs
      - run: node scripts/order-item-location-db-test.mjs
      - run: node scripts/dashboard-metrics-db-test.mjs
      - run: node scripts/dashboard-error-test.mjs
      - run: node scripts/order-relocation-db-test.mjs
      - run: node --test scripts/store-name-test.mjs
      - run: node scripts/store-name-db-test.mjs
      - name: PostgreSQL isolado para concorrência
        run: npm install --prefix "$RUNNER_TEMP/food-db-runtime" --no-save --no-audit --no-fund embedded-postgres@17.9.0-beta.17 pg@8.16.3
      - name: Nomes de loja únicos em duas sessões
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/store-name-postgres-test.mjs
      - name: Edição e retry de retirada concorrentes
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/order-relocation-postgres-test.mjs
      - name: Reservas e transferências concorrentes
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/recipe-concurrency-db-test.mjs
      - name: Edição de pedidos conserva local e reserva em duas sessões
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/order-item-location-postgres-test.mjs
