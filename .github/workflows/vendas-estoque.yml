name: Vendas e estoque
on:
  pull_request:
    paths:
      - 'src/**'
      - 'worker/**'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/_headers'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'scripts/**'
      - 'qa/admin-clarity.config.ts'
      - 'qa/receipt-contacts.config.ts'
      - 'qa/tests/modules/receipt-contacts.spec.ts'
      - 'qa/tests/modules/receipt-payment.spec.ts'
      - 'qa/tests/modules/point-receipt-editor.spec.ts'
      - 'qa/tests/modules/payment-status.spec.ts'
      - 'vite.config.ts'
      - 'qa/tests/modules/admin-clarity.spec.ts'
      - 'qa/tests/modules/fixtures.ts'
      - 'qa/package.json'
      - 'qa/package-lock.json'
      - 'supabase/migrations/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/food-order-payment/**'
      - 'supabase/functions/food-public-checkout/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vendas-estoque.yml'
  workflow_dispatch:
jobs:
  admin-ux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json
      - run: npm ci
      - run: npm ci --prefix qa
      - run: npm exec --prefix qa -- playwright install --with-deps chromium
      - run: npm exec --prefix qa -- playwright test --config qa/admin-clarity.config.ts
      - run: npm exec --prefix qa -- playwright test --config qa/receipt-contacts.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-ux-failure
          path: qa/test-results
          retention-days: 7
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:seo
      - run: node --test scripts/password-recovery-test.mjs
      - run: node --test scripts/appearance-editor-test.mjs scripts/receipt-payment-test.mjs
      - run: node scripts/receipt-payment-db-test.mjs
      - run: node scripts/receipt-contacts-db-test.mjs
      - run: node scripts/point-contacts-location-db-test.mjs
      - run: node scripts/receipt-source-db-test.mjs
      - run: npm run test:payment-links
      - run: npm run test:fitness
      - run: npm run test:fitness-pilot-db
      - run: npm run smoke
      - run: npm run test:critical
      - run: npm run test:integrations
      - run: node scripts/sales-stock-db-test.mjs
      - run: node scripts/order-item-location-db-test.mjs
      - run: node scripts/dashboard-metrics-db-test.mjs
      - run: node scripts/dashboard-error-test.mjs
      - run: node scripts/order-relocation-db-test.mjs
      - run: node --test scripts/store-name-test.mjs
      - run: node scripts/store-name-db-test.mjs
      - name: PostgreSQL isolado para concorrência
        run: npm install --prefix "$RUNNER_TEMP/food-db-runtime" --no-save --no-audit --no-fund embedded-postgres@17.9.0-beta.17 pg@8.16.3
      - name: Comprovante, retry e reversão concorrentes
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/receipt-payment-postgres-test.mjs
      - name: Nomes de loja únicos em duas sessões
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/store-name-postgres-test.mjs
      - name: Edição e retry de retirada concorrentes
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/order-relocation-postgres-test.mjs
      - name: Reservas e transferências concorrentes
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/recipe-concurrency-db-test.mjs
      - name: Edição de pedidos conserva local e reserva em duas sessões
        env:
          FOOD_DB_TEST_RUNTIME: ${{ runner.temp }}/food-db-runtime/node_modules
        run: node scripts/order-item-location-postgres-test.mjs
